server.address=0.0.0.0
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${PORT:8080}
spring.application.name=shop-api

# MongoDB Atlas
spring.data.mongodb.uri=${SPRING_MONGODB_URI:}

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://new-dove-6.clerk.accounts.dev/.well-known/jwks.json

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://hcmuaf-22130112.lvh.me:3000}

# VNPay Config Sandbox
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:}

logging.level.org.springframework.security=DEBUG

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Gemini API
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

# GHN Config
ghn.token=${GHN_TOKEN:}
ghn.shop-id=${GHN_SHOP_ID:}
ghn.api.url=${GHN_API_URL:https://online-gateway.ghn.vn/shiip/public-api}
